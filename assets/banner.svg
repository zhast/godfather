<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Godfather</title>
  <desc id="desc">Route each coding task to the best available AI coding CLI.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="872" height="232" rx="20" fill="url(#card)" stroke="#30363d" stroke-width="2"/>

  <!-- ranked list: the first available row is picked -->
  <g transform="translate(64 78)">
    <rect x="0" y="0" width="92" height="16" rx="8" fill="#30363d"/>
    <rect x="0" y="34" width="92" height="16" rx="8" fill="#e3b341"/>
    <rect x="0" y="68" width="92" height="16" rx="8" fill="#30363d"/>
    <path d="M108 42 h34 m-10 -9 l10 9 l-10 9" fill="none" stroke="#e3b341" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="240" y="126" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#f0f6fc">Godfather</text>
    <text x="243" y="168" font-size="19" fill="#9da7b3">Route each coding task to the best available AI coding CLI.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6e7681">
    <text x="243" y="204">codex · cursor · grok · agy</text>
  </g>
</svg>
